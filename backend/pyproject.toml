[project]
name = "facet-backend"
version = "0.1.0"
description = "Facet analytics platform API and workers"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.165,<1",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.11",
  "pydantic-settings>=2.16",
  "sqlalchemy>=2.0.40",
  "alembic>=1.20",
  "psycopg[binary]>=3.3",
  "duckdb==2.0.1",
  "pyarrow>=26",
  "sqlglot>=30.35",
  "python-multipart>=0.0.34",
  "psutil>=7",
]

[dependency-groups]
bench = [
  "matplotlib>=3.10",
  "httpx>=0.28",
]
dev = [
  "pytest>=9",
  "pytest-timeout>=2.4",
  "httpx>=0.28",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-psutil",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "S"]
ignore = ["S101", "S608", "B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B", "E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["sqlglot.*", "pyarrow.*", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
